[project]
name = "rc-property"
version = "0.1.0"
description = "Bilingual RC Property project catalogue"
requires-python = ">=3.13,<3.14"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["design", ".runtime", "app/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

