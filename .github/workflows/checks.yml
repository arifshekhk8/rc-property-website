name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ./scripts/install-gitleaks.sh
      - run: .runtime/tools/gitleaks git --redact --no-banner --log-opts="--all"
  django:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rc_property_test
          POSTGRES_USER: rc_test
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://rc_test:local-ci-only@localhost:5432/rc_property_test
      DATABASE_SSLMODE: disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: ruff check app scripts
      - run: ruff format --check app scripts
      - run: python app/manage.py check
      - run: python app/manage.py makemigrations --check --dry-run
      - run: python app/manage.py collectstatic --noinput --verbosity 0
      - run: python app/manage.py test tests
      - run: python scripts/check_production.py
      - run: bandit -r app scripts -x app/tests,app/projects/migrations -q
      - run: pip-audit -r requirements.lock --disable-pip --no-deps --progress-spinner off
